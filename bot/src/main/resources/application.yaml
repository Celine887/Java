server:
  port: 8080

spring:
  application:
    name: bot
  datasource:
    url: jdbc:postgresql://localhost:5432/link_tracker_bot
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  grpc:
    server:
      port: 9090
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    consumer:
      group-id: bot-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"

app:
  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    update-listener-sleep: 1s
    debug: false
  kafka:
    topic:
      link-updates: link.processed-updates
      link-updates-dlq: link-updates-dlq
    retry:
      max-attempts: 3
      backoff-interval: 1000
