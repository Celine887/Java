spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    consumer:
      group-id: test-group
      auto-offset-reset: earliest
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

app:
  kafka:
    topic:
      raw-updates: test-raw-updates
      processed-updates: test-processed-updates
  ai-agent:
    filtering:
      stop-words:
        - spam
        - ads
      excluded-authors:
        - bot-user
      min-length: 10
    summarization:
      threshold: 50
      mode: stub
    prioritization:
      high-keywords:
        - critical
        - urgent
        - breaking
        - security
      low-keywords:
        - minor
        - typo
        - chore
        - docs
    grouping:
      window-ms: 1000

logging:
  level:
    backend.academy.linktracker.ai: DEBUG
    org.springframework.kafka: WARN