server:
  port: 8081

spring:
  application:
    name: scrapper
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: grpc,jpa
  datasource:
    url: jdbc:postgresql://localhost:5432/link_tracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

app:
  database:
    access-type: jpa
  scheduler:
    enabled: true
    interval: 60s
    batch-size: 1000
    sub-batch-size: 250
    thread-pool-size: 4
    force-check-delay: 10s
  notification:
    transport: kafka
  outbox:
    poll-interval: 5000
  kafka:
    topic:
      link-updates: link.raw-updates
      link-updates-dlq: link-updates-dlq
  bot-client:
    base-url: http://localhost:8080
  bot:
    grpc:
      host: localhost
      port: 9090
  github-client:
    base-url: https://api.github.com
  stackoverflow-client:
    base-url: https://api.stackexchange.com
  valkey:
    enabled: true
    host: localhost
    port: 6379
    password:
    ttl-seconds: 300
    client-side-caching:
      enabled: false

resilience4j:
  circuitbreaker:
    instances:
      githubClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
      stackoverflowClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
      botClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
  retry:
    instances:
      githubClient:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: false
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - java.util.concurrent.TimeoutException
          - java.net.http.HttpTimeoutException
      stackoverflowClient:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: false
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - java.util.concurrent.TimeoutException
          - java.net.http.HttpTimeoutException
      botClient:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: false
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - java.util.concurrent.TimeoutException
          - java.net.http.HttpTimeoutException
  timelimiter:
    instances:
      githubClient:
        timeout-duration: 5s
      stackoverflowClient:
        timeout-duration: 5s
      botClient:
        timeout-duration: 5s
  ratelimiter:
    instances:
      publicApi:
        limit-for-period: 100
        limit-refresh-period: 1m
        timeout-duration: 0s
