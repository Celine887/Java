server:
  port: 8081

spring:
  application:
    name: scrapper
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: grpc,jpa
  datasource:
    url: jdbc:postgresql://localhost:5432/link_tracker
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

app:
  database:
    access-type: jpa
  scheduler:
    enabled: true
    interval: 60s
    batch-size: 1000
    sub-batch-size: 250
    thread-pool-size: 4
    force-check-delay: 10s
  bot-client:
    base-url: http://localhost:8080
  bot:
    grpc:
      host: localhost
      port: 9090
  github-client:
    base-url: https://api.github.com
  stackoverflow-client:
    base-url: https://api.stackexchange.com
