server:
  port: 8081

spring:
  application:
    name: scrapper
  config:
    import: optional:file:.env[.properties]

app:
  scheduler:
    enabled: true
    interval: 60s
    force-check-delay: 10s
  bot-client:
    base-url: http://localhost:8080
  github-client:
    base-url: https://api.github.com
  stackoverflow-client:
    base-url: https://api.stackexchange.com
